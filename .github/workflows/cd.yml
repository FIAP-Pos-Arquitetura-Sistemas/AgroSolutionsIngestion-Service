name: CD - Build e Deploy Multisserviço

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push Ingestion
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/ingestion/Dockerfile # Caminho para a pasta que criamos
          push: true
          tags: viniciusdelr/agrosolutions-ingestionservice:v1

      - name: Build e push Processor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/processor/Dockerfile # Caminho para a pasta que criamos
          push: true
          tags: viniciusdelr/agrosolutions-processor:v1

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: 'fiap-rg' 
          cluster-name: 'agro-solutions-cluster'

      - name: Deploy to AKS
        uses: Azure/k8s-deploy@v4
        with:
          manifests: |
            k8s/ingestion-deploy.yml
            k8s/rabbitmq.yml
            k8s/processor-deploy.yml
          images: |
            viniciusdelr/agrosolutions-ingestionservice:v1
            viniciusdelr/agrosolutions-processor:v1